name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: sh packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: packaging/build/*.AppImage }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: packaging/build/*.AppImage }

  windows:
    # Kirigami has no Windows wheel, so it is built from source against the same Qt that PySide6 ships.
    runs-on: windows-2022
    permissions: { contents: write }
    env:
      QT_VERSION: "6.8.2"
      KF_TAG: "v6.10.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Qt SDK (for building Kirigami)
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -m qtshadertools --outputdir C:\Qt
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build Kirigami
        shell: pwsh
        run: |
          $env:Path = "C:\Qt\$env:QT_VERSION\msvc2022_64\bin;$env:Path"
          git clone --depth 1 --branch $env:KF_TAG https://invent.kde.org/frameworks/extra-cmake-modules.git ecm
          git clone --depth 1 --branch $env:KF_TAG https://invent.kde.org/frameworks/kirigami.git kirigami
          cmake -S ecm -B ecm/b -DCMAKE_INSTALL_PREFIX=C:\kf -DBUILD_TESTING=OFF -DBUILD_HTML_DOCS=OFF -DBUILD_MAN_DOCS=OFF
          cmake --install ecm/b
          cmake -S kirigami -B kirigami/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:\kf;C:\Qt\$env:QT_VERSION\msvc2022_64" -DCMAKE_INSTALL_PREFIX=C:\kf -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF
          cmake --build kirigami/b
          cmake --install kirigami/b
      - name: Package
        shell: pwsh
        run: |
          pip install "PySide6==$env:QT_VERSION" pyinstaller yt-dlp
          $env:KIRIGAMI_DIR = "C:\kf\lib\qml"
          if (-not (Test-Path $env:KIRIGAMI_DIR)) { $env:KIRIGAMI_DIR = "C:\kf\qml" }
          pyinstaller packaging/windows/marquee.spec --noconfirm
          Copy-Item (Get-Command yt-dlp).Source dist\Marquee\yt-dlp.exe -ErrorAction SilentlyContinue
          Compress-Archive dist\Marquee Marquee-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: Marquee-windows.zip }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: Marquee-windows.zip }
