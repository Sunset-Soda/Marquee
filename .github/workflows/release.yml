name: Release
on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the builds to (for example 0.1.1). Leave empty to only build."
        required: false
        default: ""

jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: sh packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: packaging/build/*.AppImage }
      - if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: packaging/build/*.AppImage
