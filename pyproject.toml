[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marquee"
version = "1.3.6"
description = "Media library and in-app player, native Qt 6 / Kirigami"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
qt = ["PySide6>=6.6"]

[project.scripts]
marquee = "marquee.__main__:main"

[tool.setuptools]
packages = ["marquee", "marquee.core", "marquee.qt", "marquee._vendor", "marquee._vendor.ytmusicapi",
            "marquee._vendor.ytmusicapi.auth", "marquee._vendor.ytmusicapi.auth.oauth", "marquee._vendor.ytmusicapi.mixins",
            "marquee._vendor.ytmusicapi.models", "marquee._vendor.ytmusicapi.models.content", "marquee._vendor.ytmusicapi.parsers"]

[tool.setuptools.package-data]
"marquee.qt" = ["qml/*.qml", "qml/*.svg", "icon.svg"]
"marquee._vendor.ytmusicapi" = ["LICENSE", "locales/*/LC_MESSAGES/*", "py.typed"]
